type User @table {
  username: String!
  email: String!
  createdAt: Timestamp!
  bio: String
  avatarUrl: String
}

type Post @table {
  author: User!
  mediaUrl: String!
  mediaType: String!
  createdAt: Timestamp!
  caption: String
}

type Follow @table(key: ["follower", "followed"]) {
  follower: User!
  followed: User!
  createdAt: Timestamp!
}

type Block @table(key: ["blocker", "blocked"]) {
  blocker: User!
  blocked: User!
  createdAt: Timestamp!
}

type Like @table(key: ["user", "post"]) {
  user: User!
  post: Post!
  createdAt: Timestamp!
}

type Comment @table {
  user: User!
  post: Post!
  content: String!
  createdAt: Timestamp!
}
