services:
  - type: web
    name: atm-fod
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: atm-fod-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATA_DIRECTORY
        value: /var/data/data
      - key: UPLOADS_DIRECTORY
        value: /var/data/uploads
      - key: YOUTUBE_API_KEY
        sync: false
