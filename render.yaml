services:
  - type: web
    name: atm-fod
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATA_DIRECTORY
        value: /tmp/atm-fod/data
      - key: UPLOADS_DIRECTORY
        value: /tmp/atm-fod/uploads
      - key: YOUTUBE_API_KEY
        sync: false
